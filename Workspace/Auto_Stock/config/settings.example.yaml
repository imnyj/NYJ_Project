# config/settings.example.yaml
# Auto Stock ML/RL Trader — System Configuration Template

app:
  name: "AutoStockTrader"
  version: "1.0.0"
  log_level: "INFO"

kiwoom:
  # API Credentials (Template interpolation from environment variables)
  app_key: "${KIWOOM_APP_KEY:}"
  app_secret: "${KIWOOM_APP_SECRET:}"
  account_no: "${KIWOOM_ACCOUNT_NO:}"
  account_product_code: "${KIWOOM_ACCOUNT_PRODUCT_CODE:01}"

  # Server environment (true: Paper Trading / Mock Server, false: Real / Live Server)
  use_mock_server: true

  # Base URLs
  live_base_url: "https://openapi.kiwoom.com"
  mock_base_url: "https://openapivts.kiwoom.com"

  # Network & Retry settings
  timeout_seconds: 10.0
  max_retries: 3
  retry_backoff_factor: 0.5

trading:
  default_order_type: "MARKET"
  default_quantity: 1
  max_order_amount_krw: 10000000
